<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 모바일 세로가 본체다. 확대를 막지 않는다(접근성). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>화재피해 회복 내비게이터</title>
    <meta name="color-scheme" content="dark light" />
    <!-- 색·글꼴·간격은 tokens.css에만 있다. 시안이 바뀌면 이 파일만 갈아끼운다. -->
    <link rel="stylesheet" href="src/ui/tokens.css" />
    <link rel="stylesheet" href="src/ui/app.css" />
  </head>
  <body>
    <!--
      뼈대만 둔다. 내용은 src/ui/app.js가 채운다.

      경로가 전부 상대경로인 것은 의도다 — loadData의 base가 "data"이고,
      GitHub Pages 프로젝트 페이지는 /저장소이름/ 아래에 놓인다.
      절대경로로 바꾸면 그곳에서 전부 깨진다.
    -->
    <a class="skip" href="#main">본문으로 건너뛰기</a>

    <!-- ① 인트로 — 첫 방문만. 탭하면 즉시 통과한다. -->
    <section id="intro" class="intro" hidden></section>

    <div id="flow" class="flow" hidden>
      <header class="top">
        <div class="top__bar">
          <h1 class="top__title">화재피해 회복 내비게이터</h1>
          <!-- D-015 2층 — 결과에 닿은 뒤 작게 상시 -->
          <div id="addr-slot" class="top__addr"></div>
        </div>
      </header>

      <!-- 진입 알림 — 자치구 충돌·이어보기·주소 문제 -->
      <div id="banners" class="banners" role="status" aria-live="polite"></div>

      <!-- 안내 · 자치구 선택 · 설문 · 요약이 여기 그려진다 -->
      <main id="main" class="main"></main>

      <!-- ④ 가로 덱 — 타임라인 · 체크 · 근거 · 연락처 -->
      <div id="deck" class="deck" hidden>
        <nav id="deck-nav" class="deck__nav" aria-label="페이지"></nav>
        <div id="deck-rail" class="deck__rail">
          <section class="page" data-page="timeline" aria-label="타임라인"></section>
          <section class="page" data-page="check" aria-label="체크"></section>
          <section class="page" data-page="sources" aria-label="근거"></section>
          <section class="page" data-page="contacts" aria-label="연락처"></section>
        </div>
      </div>

      <!-- D-015 저장 안내 — 예외(저장 막힘)와 2층 버튼이 여는 패널 -->
      <div id="save-notice" class="savebox" hidden></div>

      <footer class="foot">
        <p id="expires" class="foot__line"></p>
      </footer>
    </div>

    <script type="module" src="src/ui/app.js"></script>
  </body>
</html>
