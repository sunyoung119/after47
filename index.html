<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- 모바일 세로가 본체다. 확대를 막지 않는다(접근성). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>화재피해 회복 내비게이션</title>
    <meta name="color-scheme" content="light" />
    <!--
      ★ 캐시 버전 v=26 — **화면 파일(css·js)을 고치면 이 숫자를 손으로 올린다.**

      빌드 도구가 없어서 파일 이름에 해시가 안 붙는다. 그러면 브라우저가
      옛 파일을 붙들고 새 마크업과 섞는 일이 생긴다 — 실제로 났다(v1 → v2):
      새 index.html + 캐시에 남은 옛 tokens.css 조합에서 인트로 토큰이
      없어 `animation` 선언이 통째로 무효가 됐고, 글자가 안 보였다.
      (그 사고의 근본 방어는 app.css 인트로 절에 있다 — 기본 상태가
      보이는 것이고 연출은 keyframes의 from에만 있다.)

      한계 하나 — **ES 모듈의 상대 import에는 이 쿼리가 전파되지 않는다.**
      app.js는 새로 받아도 그것이 import하는 screens.js·recovery.js 같은
      하위 모듈은 캐시가 남을 수 있다. JS만 고친 배포에서 화면이 옛
      동작을 하면 그 자리를 의심하라.
    -->
    <!-- 색·글꼴·간격은 tokens.css에만 있다. 시안이 바뀌면 이 파일만 갈아끼운다. -->
    <link rel="stylesheet" href="src/ui/tokens.css?v=30" />
    <link rel="stylesheet" href="src/ui/app.css?v=30" />
  </head>
  <body>
    <!--
      뼈대만 둔다. 내용은 src/ui/app.js가 채운다.

      경로가 전부 상대경로인 것은 의도다 — loadData의 base가 "data"이고,
      GitHub Pages 프로젝트 페이지는 /저장소이름/ 아래에 놓인다.
      절대경로로 바꾸면 그곳에서 전부 깨진다.
    -->
    <a class="skip" href="#main">본문으로 건너뛰기</a>

    <!-- ① 랜딩 — 첫 방문만. 탭하면 즉시 통과한다. -->
    <section id="intro" class="intro" hidden></section>

    <div id="flow" class="flow" hidden>
      <!-- 확정 화면의 머리 문법 — 좌상단 서비스명, 우상단 [이전]. -->
      <header class="top">
        <div class="top__bar">
          <h1 id="brand" class="top__brand"></h1>
          <div id="top-right" class="top__right"></div>
        </div>
      </header>

      <!-- 진입 알림 — 자치구 충돌·이어보기·주소 문제 -->
      <div id="banners" class="banners" role="status" aria-live="polite"></div>

      <!-- 기본 확인·설문·전환·게이트·내 회복 경로가 여기 그려진다 -->
      <main id="main" class="main"></main>

      <!-- 보조 고지 — 저장 고지와, 위 한 장에 밀린 진입 알림이 여기 선다.
           위 슬롯을 한 장으로 묶는 규칙은 view.js의 TOP_BANNER에 있다. -->
      <div id="banners-foot" class="banners banners--foot" role="status" aria-live="polite"></div>

      <!-- D-015 저장 안내 — 예외(저장 막힘)와 HOME의 2층 버튼이 여는 패널 -->
      <div id="save-notice" class="savebox" hidden></div>

      <footer class="foot">
        <p id="expires" class="foot__line"></p>
      </footer>
    </div>

    <script type="module" src="src/ui/app.js?v=30"></script>
  </body>
</html>
